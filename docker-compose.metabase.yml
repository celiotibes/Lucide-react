version: '3.8'

services:
  metabase:
    image: metabase/metabase:v0.50.0
    container_name: crmt-metabase
    ports:
      - "3000:3000"
    environment:
      # Database configuration (H2 embedded or PostgreSQL)
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase_password}

      # Session timeout (1 hour)
      MB_SESSION_TIMEOUT: 3600000

      # Email configuration (for alerts)
      MB_EMAIL_SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      MB_EMAIL_SMTP_PORT: ${SMTP_PORT:-587}
      MB_EMAIL_SMTP_USERNAME: ${SMTP_USER:-resend}
      MB_EMAIL_SMTP_PASSWORD: ${SMTP_PASSWORD}
      MB_EMAIL_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@crmt.dev}
      MB_EMAIL_SMTP_SECURITY: tls

      # Admin setup token
      METABASE_SETUP_TOKEN: ${METABASE_SETUP_TOKEN:-setup-token-12345}

      # Java memory
      JAVA_TOOL_OPTIONS: "-Xmx2g"

    depends_on:
      metabase-db:
        condition: service_healthy

    volumes:
      - metabase-data:/metabase-data

    networks:
      - crmt-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped

  metabase-db:
    image: postgres:16-alpine
    container_name: crmt-metabase-db
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabase_password}

    volumes:
      - metabase-db-data:/var/lib/postgresql/data

    networks:
      - crmt-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  metabase-data:
  metabase-db-data:

networks:
  crmt-network:
    external: true
    name: crmt-network
