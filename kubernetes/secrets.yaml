# Kubernetes Secrets para dados sensíveis
# Arquivo: kubernetes/secrets.yaml
# AVISO: Este arquivo contém placeholders. Substituir valores reais em produção.

apiVersion: v1
kind: Secret
metadata:
  name: rental-sync-secrets
  namespace: rental-sync
  labels:
    app: rental-sync-api
    component: secrets
type: Opaque
stringData:
  # Database
  database-url: "postgresql://rental_user:CHANGE_ME_PASSWORD@postgres.rental-sync.svc.cluster.local:5432/rental_sync"
  
  # Redis
  redis-url: "redis://:CHANGE_ME_PASSWORD@redis.rental-sync.svc.cluster.local:6379/0"
  
  # JWT
  jwt-secret: "CHANGE_ME_JWT_SECRET_KEY_MIN_32_CHARS_LONG"
  
  # Variáveis de API externas
  airbnb-api-key: "CHANGE_ME_AIRBNB_API_KEY"
  booking-api-key: "CHANGE_ME_BOOKING_API_KEY"
  vrbo-api-key: "CHANGE_ME_VRBO_API_KEY"
  gemini-api-key: "CHANGE_ME_GEMINI_API_KEY"
  
  # Slack
  slack-webhook-url: "https://hooks.slack.com/services/CHANGE_ME_WEBHOOK_URL"
  
  # AWS (se usar S3 para backups)
  aws-access-key-id: "CHANGE_ME_AWS_KEY"
  aws-secret-access-key: "CHANGE_ME_AWS_SECRET"
  s3-bucket: "rental-sync-backups"
---
# Docker Registry Secret (se usar registry privado)
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: rental-sync
type: kubernetes.io/dockercfg
data:
  .dockercfg: CHANGE_ME_DOCKER_CONFIG_BASE64
---
# TLS Certificate (será criado automaticamente pelo cert-manager)
# Apenas placeholder para referência
apiVersion: v1
kind: Secret
metadata:
  name: rental-sync-tls
  namespace: rental-sync
type: kubernetes.io/tls
data:
  tls.crt: CHANGE_ME_CERT_BASE64
  tls.key: CHANGE_ME_KEY_BASE64
