# Kubernetes Namespace para o projeto
# Arquivo: kubernetes/namespace.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: rental-sync
  labels:
    name: rental-sync
    environment: production
---
# ResourceQuota - limita recursos do namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rental-sync-quota
  namespace: rental-sync
spec:
  hard:
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    pods: "50"
    services: "20"
    persistentvolumeclaims: "10"
---
# NetworkPolicy - restringe tráfego
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rental-sync-default-deny
  namespace: rental-sync
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# NetworkPolicy - permite ingress na API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: rental-sync
spec:
  podSelector:
    matchLabels:
      app: rental-sync-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
---
# NetworkPolicy - permite egress para DNS e serviços externos
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-external
  namespace: rental-sync
spec:
  podSelector:
    matchLabels:
      app: rental-sync-api
  policyTypes:
  - Egress
  egress:
  # DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  # Banco de dados e cache
  - to:
    - podSelector: {}
  # APIs externas (qualquer saída HTTPS)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
