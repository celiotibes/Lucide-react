# Kubernetes Service para exposição do API
# Arquivo: kubernetes/service.yaml

# ClusterIP Service - comunicação interna
apiVersion: v1
kind: Service
metadata:
  name: rental-sync-api
  namespace: rental-sync
  labels:
    app: rental-sync-api
    component: backend
spec:
  type: ClusterIP
  selector:
    app: rental-sync-api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 3001
    targetPort: metrics
    protocol: TCP
  sessionAffinity: None
---
# LoadBalancer Service - exposição externa
apiVersion: v1
kind: Service
metadata:
  name: rental-sync-api-lb
  namespace: rental-sync
  labels:
    app: rental-sync-api
    component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: rental-sync-api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: http
    protocol: TCP
  sessionAffinity: None
  externalTrafficPolicy: Local
---
# Headless Service - para StatefulSets (futuro)
apiVersion: v1
kind: Service
metadata:
  name: rental-sync-api-headless
  namespace: rental-sync
  labels:
    app: rental-sync-api
    component: backend
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: rental-sync-api
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
