# Kubernetes Deployment para API backend do rental listing sync
# Arquivo: kubernetes/deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental-sync-api
  namespace: rental-sync
  labels:
    app: rental-sync-api
    component: backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rental-sync-api
  template:
    metadata:
      labels:
        app: rental-sync-api
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: rental-sync-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      containers:
      - name: api
        image: rental-sync-api:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 3000
          protocol: TCP
        
        # Variáveis de ambiente
        env:
        - name: NODE_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rental-sync-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: rental-sync-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: rental-sync-secrets
              key: jwt-secret
        - name: API_PORT
          value: "3000"
        - name: METRICS_PORT
          value: "3000"
        
        # Readiness probe - verifica se está pronto para receber tráfego
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        # Liveness probe - verifica se está vivo
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Startup probe - aguarda inicialização
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        
        # Recursos alocados
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        
        # Security context do container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        # Volumes montados
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-cache
          mountPath: /var/cache/nodejs
      
      # Volumes temporários
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-cache
        emptyDir: {}
      
      # Tolerância de node falhos
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - rental-sync-api
              topologyKey: kubernetes.io/hostname
      
      # Tempo máximo para graceful shutdown
      terminationGracePeriodSeconds: 30
---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rental-sync-api
  namespace: rental-sync
---
# PodDisruptionBudget - garante mínimo de pods disponíveis
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rental-sync-api
  namespace: rental-sync
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rental-sync-api
