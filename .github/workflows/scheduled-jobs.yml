name: Scheduled Jobs

on:
  schedule:
    - cron: '0 0 * * 0'          # Weekly dependency update - Sunday at 00:00 UTC
    - cron: '0 0 * * 1,4'        # Twice weekly security scan - Tuesday & Friday at 00:00 UTC
    - cron: '0 2 * * *'          # Nightly performance benchmark - Daily at 02:00 UTC
    - cron: '0 3 * * 0'          # Weekly cleanup - Sunday at 03:00 UTC

concurrency:
  group: scheduled-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  BOT_NAME: 'Lucide Bot'
  BOT_EMAIL: 'lucide-bot@example.com'

jobs:
  dependency-update:
    name: Update Dependencies
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 0 * * 0'
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Check for outdated packages
        id: outdated
        run: |
          npm outdated --json > outdated.json || true

          # Count outdated packages
          OUTDATED_COUNT=$(jq 'length' outdated.json)
          echo "count=$OUTDATED_COUNT" >> $GITHUB_OUTPUT

          echo "📦 Found $OUTDATED_COUNT outdated packages"
          cat outdated.json | jq -r '.[] | "\(.name): \(.current) -> \(.latest)"' | head -10

      - name: Update dependencies
        if: steps.outdated.outputs.count > 0
        run: |
          npm update
          cd server && npm update && cd ..
          cd sync-server && npm update && cd ..
          cd mobile-app && npm update && cd ..

      - name: Run tests
        if: steps.outdated.outputs.count > 0
        run: npm test
        continue-on-error: true

      - name: Build application
        if: steps.outdated.outputs.count > 0
        run: npm run build
        continue-on-error: true

      - name: Create Pull Request
        if: steps.outdated.outputs.count > 0
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore: update dependencies'
          title: 'chore: Update dependencies'
          body: |
            ## Dependency Update

            Updated dependencies as of ${{ github.event.schedule }}

            ### Changes
            - Updated npm packages
            - Ran tests
            - Built application

            ⚠️ **Please review and test thoroughly before merging**
          branch: deps/update-weekly
          labels: dependencies,automated

      - name: Upload outdated report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outdated-report
          path: outdated.json
          retention-days: 30

  security-scan-scheduled:
    name: Scheduled Security Scan
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 0 * * 1,4'
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run comprehensive npm audit
        id: audit
        run: |
          npm audit --json > full-audit-report.json || AUDIT_EXIT=$?

          CRITICAL=$(jq '[.vulnerabilities[] | select(.severity=="critical")] | length' full-audit-report.json)
          HIGH=$(jq '[.vulnerabilities[] | select(.severity=="high")] | length' full-audit-report.json)

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT

          if [ "$CRITICAL" -gt 0 ]; then
            echo "⚠️ Found $CRITICAL critical vulnerabilities"
            exit 1
          fi
        continue-on-error: true

      - name: Run Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/typescript
            p/react
            p/owasp-top-ten
        continue-on-error: true

      - name: Run TruffleHog
        run: |
          pip install trufflehog
          trufflehog filesystem . --json > secrets-scan.json || true
        continue-on-error: true

      - name: Create security report issue
        if: steps.audit.outputs.critical > 0 || steps.audit.outputs.high > 0
        uses: actions/github-script@v7
        with:
          script: |
            const critical = ${{ steps.audit.outputs.critical || 0 }};
            const high = ${{ steps.audit.outputs.high || 0 }};

            const title = `🔒 Security Alert: ${critical} critical, ${high} high vulnerabilities`;
            const body = `
            ## Security Scan Results

            **Severity Summary:**
            - 🔴 Critical: ${critical}
            - 🟠 High: ${high}

            **Action Required:**
            1. Review the audit report
            2. Update vulnerable packages
            3. Run tests and verify
            4. Close this issue when resolved

            **Links:**
            - [Full Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Audit Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'automated']
            });

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-report
          path: |
            full-audit-report.json
            secrets-scan.json
          retention-days: 30

  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * *'
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run bundle analysis
        run: |
          npm run build 2>&1 | tee build-output.log

          # Extract build sizes
          echo "## Build Performance" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 build-output.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Analyze bundle size
        run: |
          cat > analyze-bundle.js << 'EOF'
          const fs = require('fs');
          const path = require('path');

          function getDirectorySize(dir) {
            let size = 0;
            const files = fs.readdirSync(dir);

            files.forEach(file => {
              const filePath = path.join(dir, file);
              const stat = fs.statSync(filePath);

              if (stat.isDirectory()) {
                size += getDirectorySize(filePath);
              } else {
                size += stat.size;
              }
            });

            return size;
          }

          const distSize = getDirectorySize('./dist');
          const distMB = (distSize / 1024 / 1024).toFixed(2);

          console.log(`Total dist size: ${distMB} MB`);

          // Write to JSON for comparison
          const benchmark = {
            timestamp: new Date().toISOString(),
            distSize: distSize,
            distSizeMB: parseFloat(distMB)
          };

          fs.writeFileSync('benchmark.json', JSON.stringify(benchmark, null, 2));
          EOF

          node analyze-bundle.js

      - name: Run lighthouse audit
        run: |
          npm install -g @lhci/cli@0.9.x
          lhci autorun || true
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-benchmark
          path: |
            benchmark.json
            build-output.log
          retention-days: 60

      - name: Compare with previous benchmark
        run: |
          echo "📊 Performance Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Build output logged" >> $GITHUB_STEP_SUMMARY
          echo "- Bundle analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View detailed metrics](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)" >> $GITHUB_STEP_SUMMARY

  cleanup-artifacts:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * 0'
    timeout-minutes: 15

    steps:
      - name: Remove old artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          name: |
            coverage-report-*
            lint-results
            audit-report
            playwright-report
            test-videos
          failOnError: false

      - name: Cleanup workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const RETENTION_DAYS = 30;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - RETENTION_DAYS);

            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: 'completed'
            });

            let deletedCount = 0;
            for (const run of runs.data.workflow_runs) {
              const runDate = new Date(run.updated_at);
              if (runDate < cutoffDate) {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                deletedCount++;
              }
            }

            console.log(`Deleted ${deletedCount} old workflow runs`);

      - name: Summary
        run: |
          echo "## Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Removed old artifacts" >> $GITHUB_STEP_SUMMARY
          echo "✅ Cleaned up old workflow runs" >> $GITHUB_STEP_SUMMARY
          echo "📅 Retention period: 30 days" >> $GITHUB_STEP_SUMMARY

  scheduled-summary:
    name: Scheduled Jobs Summary
    runs-on: ubuntu-latest
    needs: [dependency-update, security-scan-scheduled, performance-benchmark, cleanup-artifacts]
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "## Scheduled Jobs Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Update: ${{ needs.dependency-update.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan-scheduled.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Benchmark: ${{ needs.performance-benchmark.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Cleanup Artifacts: ${{ needs.cleanup-artifacts.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Scheduled jobs execution failed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message
        continue-on-error: true
