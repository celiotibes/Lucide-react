name: Security Scanning

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 0 * * 1,4'  # Tuesday and Friday at 00:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scanning:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci && cd ..
          cd sync-server && npm ci && cd ..
          cd mobile-app && npm ci && cd ..

      - name: Run npm audit
        id: audit
        run: |
          echo "Running npm audit with JSON output..."
          npm audit --json > audit-report.json || AUDIT_EXIT_CODE=$?
          echo "audit_exit_code=${AUDIT_EXIT_CODE:-0}" >> $GITHUB_OUTPUT

          # Count vulnerabilities
          CRITICAL=$(jq '[.vulnerabilities[] | select(.severity=="critical")] | length' audit-report.json)
          HIGH=$(jq '[.vulnerabilities[] | select(.severity=="high")] | length' audit-report.json)
          MODERATE=$(jq '[.vulnerabilities[] | select(.severity=="moderate")] | length' audit-report.json)

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Convert audit report to SARIF
        run: |
          npm install -g npm-audit-to-sarif
          npm-audit-to-sarif --input audit-report.json --output audit-results.sarif
        continue-on-error: true

      - name: Upload audit results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: audit-results.sarif
          category: 'npm-audit'
        continue-on-error: true

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

      - name: Comment PR with audit results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const critical = ${{ steps.audit.outputs.critical || 0 }};
            const high = ${{ steps.audit.outputs.high || 0 }};
            const moderate = ${{ steps.audit.outputs.moderate || 0 }};

            let severity = '✅';
            if (critical > 0) severity = '🔴';
            else if (high > 0) severity = '🟠';
            else if (moderate > 0) severity = '🟡';

            const message = `
            ${severity} **Dependency Audit Results**
            - Critical: ${critical}
            - High: ${high}
            - Moderate: ${moderate}

            [View audit report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
        continue-on-error: true

  code-scanning:
    name: Code Scanning (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with SARIF output
        run: |
          npm run lint -- --format json --output-file eslint-results.json || true
        continue-on-error: true

      - name: Convert ESLint to SARIF
        run: |
          cat > convert-eslint.js << 'EOF'
          const fs = require('fs');
          const eslintResults = JSON.parse(fs.readFileSync('eslint-results.json', 'utf8'));

          const sarif = {
            version: "2.1.0",
            runs: [{
              tool: { driver: { name: "ESLint", version: "9.0" } },
              results: []
            }]
          };

          eslintResults.forEach(file => {
            file.messages.forEach(msg => {
              sarif.runs[0].results.push({
                ruleId: msg.ruleId,
                level: msg.severity === 2 ? 'error' : 'warning',
                message: { text: msg.message },
                locations: [{
                  physicalLocation: {
                    artifactLocation: { uri: file.filePath },
                    region: {
                      startLine: msg.line,
                      startColumn: msg.column
                    }
                  }
                }]
              });
            });
          });

          fs.writeFileSync('eslint-results.sarif', JSON.stringify(sarif, null, 2));
          EOF

          node convert-eslint.js
        continue-on-error: true

      - name: Upload ESLint results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: eslint-results.sarif
          category: 'eslint'
        continue-on-error: true

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: pip install trufflehog

      - name: Run TruffleHog scan
        id: trufflehog
        run: |
          trufflehog filesystem . --json --fail > trufflehog-results.json || EXIT_CODE=$?
          echo "scan_exit_code=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Parse TruffleHog results
        if: steps.trufflehog.outcome == 'success'
        run: |
          if [ -f trufflehog-results.json ] && [ -s trufflehog-results.json ]; then
            echo "## Secrets Found" >> $GITHUB_STEP_SUMMARY
            jq -r '.[] | "- \(.stringsFound | join(", "))"' trufflehog-results.json >> $GITHUB_STEP_SUMMARY || true
          else
            echo "✅ No secrets detected" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Upload TruffleHog results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog-report
          path: trufflehog-results.json
          retention-days: 30
        continue-on-error: true

  sast-analysis:
    name: SAST Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/typescript
            p/react
        continue-on-error: true

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: .semgrep.json
          retention-days: 30
        continue-on-error: true

  typescript-strict:
    name: TypeScript Strict Mode
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit
        continue-on-error: false

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scanning, code-scanning, secret-scanning, sast-analysis, typescript-strict]
    if: always()

    steps:
      - name: Create security summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Scanning: ${{ needs.dependency-scanning.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Scanning: ${{ needs.code-scanning.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Scanning: ${{ needs.secret-scanning.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- SAST Analysis: ${{ needs.sast-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript Strict: ${{ needs.typescript-strict.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical issues
        if: contains(needs.dependency-scanning.result, 'failure')
        run: |
          echo "⚠️ Critical security issues detected"
          exit 1
        continue-on-error: true
