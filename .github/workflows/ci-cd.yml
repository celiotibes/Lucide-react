name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: legaluser
          POSTGRES_PASSWORD: legalpass
          POSTGRES_DB: legal_automation_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: cd legal-automation && npm ci

      - name: Lint
        run: cd legal-automation && npm run lint

      - name: Type check
        run: cd legal-automation && npm run type-check

      - name: Run tests
        run: cd legal-automation && npm test
        env:
          DATABASE_URL: postgresql://legaluser:legalpass@localhost:5432/legal_automation_test

      - name: Build
        run: cd legal-automation && npm run build

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./legal-automation/coverage/lcov.info

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'legal-automation'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  docker:
    runs-on: ubuntu-latest
    needs: [lint-and-test, security]
    if: github.event_name == 'push' && github.ref_type == 'branch'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./legal-automation
          push: false
          tags: legal-automation:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # TODO: Implementar deploy real (Docker, Kubernetes, etc)

  deploy-production:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # TODO: Implementar deploy real com aprovação manual
