name: Test Suite

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - claude/**
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            sync-server/package-lock.json
            mobile-app/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
            sync-server/node_modules
            mobile-app/node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci && cd ..
          cd sync-server && npm ci && cd ..
          cd mobile-app && npm ci && cd ..

      - name: Run linter
        run: npm run lint
        continue-on-error: false

      - name: Run TypeScript check
        run: npm run build:typecheck
        continue-on-error: false

      - name: Run unit tests
        run: npm test
        env:
          CI: true
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Generate coverage report
        run: npm test -- --coverage
        env:
          CI: true
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          COVERAGE=$(npm test -- --coverage --silent 2>/dev/null | grep -oP 'Statements\s*:\s*\K[\d.]+' || echo "0")
          echo "Coverage: ${COVERAGE}%"

          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage is below 70% threshold (current: ${COVERAGE}%)"
            exit 1
          else
            echo "✅ Coverage meets 70% threshold (current: ${COVERAGE}%)"
          fi
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 30

      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let testStatus = '✅ All tests passed!';
            let coverageInfo = '';

            if (fs.existsSync('./coverage/coverage-summary.json')) {
              const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;
              coverageInfo = `
            ### Coverage Report
            - Statements: ${total.statements.pct}%
            - Branches: ${total.branches.pct}%
            - Functions: ${total.functions.pct}%
            - Lines: ${total.lines.pct}%
            `;
            }

            const message = `
            ## Test Results (Node ${{ matrix.node-version }})
            ${testStatus}
            ${coverageInfo}
            [View workflow details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Node Version: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: coverage-report-node-${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY

  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --format json --output-file lint-results.json || true

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: lint-results.json
          retention-days: 30

      - name: Comment PR with lint issues
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('./lint-results.json')) {
              const lintResults = JSON.parse(fs.readFileSync('./lint-results.json', 'utf8'));
              const issues = lintResults.reduce((acc, file) => acc + file.messages.length, 0);

              if (issues > 0) {
                const message = `⚠️ **Linting Issues Found: ${issues}**\n\n[View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: message
                });
              }
            }
        continue-on-error: true
