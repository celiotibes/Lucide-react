name: Test Reporting & Coverage

on:
  workflow_run:
    workflows: ['Unit Tests', 'E2E Tests']
    types: [completed]
  push:
    branches:
      - main
      - develop
    paths:
      - 'mobile-app/coverage/**'
      - 'mobile-app/artifacts/e2e/coverage/**'

jobs:
  consolidate-reports:
    name: Consolidate Test Reports
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'mobile-app/package-lock.json'

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Download all test artifacts
        uses: dawidd6/action-download-artifact@v2
        with:
          path: test-artifacts
          workflow_conclusion: completed

      - name: Generate consolidated coverage report
        working-directory: mobile-app
        run: npm run test:report
        continue-on-error: true
        env:
          ARTIFACTS_PATH: ../test-artifacts
          REPORT_OUTPUT: ./coverage/index.html

      - name: Create coverage summary
        run: |
          mkdir -p coverage-summary
          cat > coverage-summary/summary.md << 'EOF'
          # Test Coverage Report

          ## Coverage Metrics

          | Category | Coverage | Target | Status |
          |----------|----------|--------|--------|
          | Statements | - | 80% | - |
          | Branches | - | 80% | - |
          | Functions | - | 80% | - |
          | Lines | - | 80% | - |

          ## Test Results

          - **Unit Tests**: Pending
          - **Integration Tests**: Pending
          - **E2E Tests (Android)**: Pending
          - **E2E Tests (iOS)**: Pending

          ## Coverage by Module

          ### Services (Target: 85%)
          - API Service: -
          - Database Service: -
          - Auth Service: -

          ### Database (Target: 85%)
          - Models: -
          - Migrations: -

          ### Components (Target: 80%)
          - Navigation: -
          - Screens: -
          - Forms: -

          ### Utils (Target: 80%)
          - Validators: -
          - Formatters: -
          - Helpers: -

          ---
          *Report generated: $(date)*
          EOF

      - name: Upload consolidated report to GitHub Pages
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-summary
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('coverage-summary/summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  publish-coverage:
    name: Publish Coverage to GitHub Pages
    runs-on: ubuntu-latest
    needs: [consolidate-reports]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: public

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

  notify-status:
    name: Notify Test Status
    runs-on: ubuntu-latest
    needs: [consolidate-reports]
    if: always()

    steps:
      - name: Check test status
        run: |
          echo "Test Consolidation: ${{ needs.consolidate-reports.result }}"

      - name: Send Slack notification (optional)
        if: failure()
        run: |
          echo "Tests failed. Slack notification would be sent here."
          echo "Configure SLACK_WEBHOOK_URL secret to enable notifications."

      - name: Create GitHub Issue on failure
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'E2E Tests Failed - CI Run ' + context.runId,
              body: 'Test reporting workflow failed. Check the workflow run for details.\n\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
