# ============================================================================
# Lucide CRMT - Production Environment Values
# ============================================================================
# IMPORTANT: Update all sensitive values before deploying to production!
# Use sealed-secrets or external-secrets for secrets management

replicaCount: 3

image:
  registry: gcr.io/your-project  # Update to your registry
  repository: lucide-crmt
  tag: "22.21"
  pullPolicy: IfNotPresent
  # pullSecrets:
  #   - name: gcr-json-key

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

service:
  type: ClusterIP
  port: 80
  annotations:
    cloud.google.com/neg: '{"ingress": true}'

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  hosts:
    - host: accounting.your-domain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: lucide-tls-prod
      hosts:
        - accounting.your-domain.com

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

env:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  DATABASE_TYPE: "postgresql"  # Change to postgresql for production
  CORS_CREDENTIALS: "true"
  SENTRY_ENVIRONMENT: "production"
  SENTRY_RELEASE: "22.21"

secrets:
  create: false
  existingSecret: lucide-secret-prod  # Use existing secret for production
  # Or use external-secrets operator:
  # See values for external-secrets-operator integration

persistence:
  enabled: true
  storageClass: "fast-ssd"  # Use performant storage in production
  size: 50Gi
  accessMode: ReadWriteOnce

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8787
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

database:
  enabled: true
  type: "postgresql"
  postgresql:
    enabled: true
    auth:
      username: "lucide_user"
      password: "change-me-secure-password"  # Use strong password
      database: "lucide_crmt"
    primary:
      persistence:
        enabled: true
        size: 100Gi
        storageClassName: "fast-ssd"

backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM UTC
  retention: 30
  storageClass: "standard"
  size: "20Gi"

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

podDisruptionBudget:
  enabled: true
  minAvailable: 2

affinity:
  podAntiAffinity: "preferred"

nodeSelector:
  workload: accounting

tolerations:
  - key: workload
    operator: Equal
    value: accounting
    effect: NoSchedule

terminationGracePeriodSeconds: 60

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  initialDelaySeconds: 20
  periodSeconds: 5

serviceAccount:
  create: true
  annotations:
    # For AWS IRSA:
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/lucide-crmt-role
    # For GKE Workload Identity:
    # iam.gke.io/gcp-service-account: lucide-crmt@your-project.iam.gserviceaccount.com

rbac:
  create: true
