{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lucide-crmt.configMapName" . }}
  namespace: {{ include "lucide-crmt.namespace" . }}
  labels:
    {{- include "lucide-crmt.labels" . | nindent 4 }}
data:
  {{- with .Values.env }}
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.configMap.data }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
