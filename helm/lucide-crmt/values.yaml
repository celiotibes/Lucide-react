# ============================================================================
# Lucide CRMT Helm Chart - Default Values
# Phase 22.21: Kubernetes Deployment
# ============================================================================
# This is the default values file for the Lucide CRMT Helm chart.
# Customize for your environment using multiple values files:
#   helm install lucide ./helm/lucide-crmt -f values.yaml -f values-production.yaml
# ============================================================================

# ============================================================================
# Namespace Configuration
# ============================================================================
namespace:
  create: true
  name: lucide-crmt

# ============================================================================
# Helm Release Name
# ============================================================================
nameOverride: ""
fullnameOverride: ""

# ============================================================================
# Image Configuration
# ============================================================================
image:
  registry: docker.io
  repository: lucide-react
  tag: "22.21"  # Override with specific version tag
  pullPolicy: IfNotPresent
  # pullSecrets: []  # Uncomment if using private registry

# ============================================================================
# Replicas and Scaling
# ============================================================================
replicaCount: 2

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # For custom metrics:
  # - metrics:
  #     - type: Resource
  #       resource:
  #         name: cpu
  #         target:
  #           type: Utilization
  #           averageUtilization: 70

# ============================================================================
# Service Configuration
# ============================================================================
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8787
  annotations: {}
  # annotations:
  #   cloud.google.com/neg: '{"ingress": true}'
  # For LoadBalancer:
  # type: LoadBalancer
  # loadBalancerIP: "192.168.1.100"

# ============================================================================
# Ingress Configuration
# ============================================================================
ingress:
  enabled: true
  className: "nginx"  # or "gce" for GKE, "alb" for EKS
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  hosts:
    - host: accounting.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: lucide-tls
      hosts:
        - accounting.example.com
  # For multiple hosts:
  # hosts:
  #   - host: accounting.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  #   - host: accounting-staging.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix

# ============================================================================
# Resource Requests and Limits
# ============================================================================
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
  # For production, adjust based on load testing:
  # requests:
  #   cpu: 500m
  #   memory: 512Mi
  # limits:
  #   cpu: 1000m
  #   memory: 1Gi

# ============================================================================
# Pod Configuration
# ============================================================================
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8787"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

# ============================================================================
# Health Checks (Probes)
# ============================================================================
livenessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
    scheme: HTTP
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
    scheme: HTTP
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 2

startupProbe:
  enabled: false
  httpGet:
    path: /api/health
    port: http
    scheme: HTTP
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

# ============================================================================
# Graceful Shutdown
# ============================================================================
terminationGracePeriodSeconds: 30
lifecycle:
  preStop:
    exec:
      command:
        - sh
        - -c
        - |
          sleep 5
          kill -TERM 1 || true
          timeout 20 sh -c 'while kill -0 1 2>/dev/null; do sleep 1; done' || true

# ============================================================================
# Node Affinity and Pod Disruption Budget
# ============================================================================
affinity:
  podAntiAffinity: "preferred"  # "required" or "preferred" or ""
  # podAffinityTerm:
  #   topologyKey: "kubernetes.io/hostname"

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# ============================================================================
# Persistence Configuration
# ============================================================================
persistence:
  enabled: true
  storageClass: "standard"  # Adjust to your cluster's storage class
  accessMode: ReadWriteOnce
  size: 10Gi
  # Optional: specify existing PVC
  existingClaim: ""
  # Optional: specify existing volume
  # volume:
  #   name: existing-volume
  path: /app/data

# ============================================================================
# Environment Variables - Configuration
# ============================================================================
env:
  # Core configuration
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "8787"

  # Database configuration (SQLite by default)
  DATABASE_TYPE: "sqlite"
  DATABASE_URL: "file:./data/app.db"
  # For PostgreSQL, use:
  # DATABASE_TYPE: "postgresql"
  # DATABASE_URL: "postgresql://user:password@postgres:5432/lucide_crmt"

  # CORS configuration
  CORS_CREDENTIALS: "true"

  # Logging and monitoring
  SENTRY_ENVIRONMENT: "production"
  SENTRY_RELEASE: "22.21"

# ============================================================================
# Secrets - Sensitive Configuration
# You MUST set these before deployment!
# Use sealed-secrets or external-secrets for production
# ============================================================================
secrets:
  # Create secret from values (development/testing only!)
  create: false
  # Existing secret name
  existingSecret: ""

  # Secret data (base64 encoded or plaintext if create=true)
  # API_KEY: "change-me-in-production"
  # SESSION_SECRET: "change-me-session-secret"
  # JWT_SECRET: "change-me-jwt-secret"
  # ENCRYPTION_MASTER_SECRET: "change-me-encryption-secret"

# ============================================================================
# ConfigMap - Non-sensitive Configuration
# ============================================================================
configMap:
  create: true
  # Existing ConfigMap name
  existingConfigMap: ""

  data:
    # Add custom configuration here
    # Example:
    # CUSTOM_VAR: "value"

# ============================================================================
# ServiceAccount
# ============================================================================
serviceAccount:
  create: true
  annotations: {}
  name: lucide-crmt
  # For IRSA (IAM Roles for Service Accounts - AWS/GKE):
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/lucide-crmt-role

# ============================================================================
# RBAC (Role-Based Access Control)
# ============================================================================
rbac:
  create: true

# ============================================================================
# Network Policy
# ============================================================================
networkPolicy:
  enabled: false  # Enable for production
  policyTypes:
    - Ingress
    - Egress
  # ingress: []
  # egress: []

# ============================================================================
# Pod Security Policy
# ============================================================================
podSecurityPolicy:
  enabled: false

# ============================================================================
# Monitoring and Observability
# ============================================================================
monitoring:
  enabled: true

  # Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false  # Requires Prometheus Operator
    interval: 30s
    scrapeTimeout: 10s

  # Custom metrics for HPA
  metrics:
    enabled: false  # Requires metrics-server

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

# ============================================================================
# Database Configuration
# Note: SQLite is the default, but you can deploy PostgreSQL alongside
# ============================================================================
database:
  enabled: false  # Set to true to deploy PostgreSQL
  type: "postgresql"

  # PostgreSQL subchart configuration
  postgresql:
    enabled: false
    auth:
      username: "lucide_user"
      password: "change-me-db-password"
      database: "lucide_crmt"
    primary:
      persistence:
        enabled: true
        size: 20Gi
        storageClassName: "standard"

# ============================================================================
# Backup Configuration
# ============================================================================
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM UTC
  retention: 30  # Days
  storageClass: "standard"
  size: "5Gi"

# ============================================================================
# Init Containers (e.g., for migrations)
# ============================================================================
initContainers: []
  # - name: db-migration
  #   image: lucide-react:22.21
  #   command: ["node", "server/dist/migrate.js"]
  #   env:
  #     - name: DATABASE_URL
  #       valueFrom:
  #         configMapKeyRef:
  #           name: lucide-config
  #           key: DATABASE_URL

# ============================================================================
# Sidecar Containers
# ============================================================================
sidecarContainers: []
  # - name: logging-sidecar
  #   image: fluent/fluent-bit:latest
  #   volumeMounts:
  #     - name: logs
  #       mountPath: /app/logs

# ============================================================================
# Volume Mounts
# ============================================================================
volumeMounts:
  - name: data
    mountPath: /app/data
  - name: logs
    mountPath: /app/logs
  - name: config
    mountPath: /app/config
    readOnly: true

# ============================================================================
# Node Selection
# ============================================================================
nodeSelector: {}
  # workload: accounting

tolerations: []
  # - key: workload
  #   operator: Equal
  #   value: accounting
  #   effect: NoSchedule

# ============================================================================
# Labels and Annotations
# ============================================================================
labels:
  app.kubernetes.io/name: lucide-crmt
  app.kubernetes.io/version: "22.21"
  app.kubernetes.io/component: backend

annotations:
  description: "Lucide React Accounting System (CRMT) - Phase 22.21 Kubernetes Deployment"
  managed-by: "Helm"
