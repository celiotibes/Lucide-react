# ============================================================================
# External Secrets Operator Integration
# ============================================================================
# Use this to fetch secrets from external secret managers:
# - AWS Secrets Manager
# - HashiCorp Vault
# - Google Cloud Secret Manager
# - Azure Key Vault
#
# Installation: https://external-secrets.io/latest/

---
# ============================================================================
# Example: AWS Secrets Manager
# ============================================================================
# Prerequisites:
# 1. Install external-secrets: helm install external-secrets external-secrets/external-secrets -n external-secrets-system
# 2. Create IAM role with SecretsManagerReadSecret policy
# 3. Bind IRSA (IAM Roles for Service Accounts)

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-store
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: lucide-sa

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lucide-secret
  namespace: default
  labels:
    app: lucide-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: lucide-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app: lucide-app
      type: Opaque
  data:
    # Map remote secret paths to local keys
    - secretKey: API_KEY
      remoteRef:
        key: lucide-api-key
    - secretKey: SESSION_SECRET
      remoteRef:
        key: lucide-session-secret
    - secretKey: ASAAS_API_KEY
      remoteRef:
        key: lucide-asaas-key
    - secretKey: PLUGGY_CLIENT_ID
      remoteRef:
        key: lucide-pluggy-client-id
    - secretKey: PLUGGY_CLIENT_SECRET
      remoteRef:
        key: lucide-pluggy-client-secret
    - secretKey: CERTISIGN_API_KEY
      remoteRef:
        key: lucide-certisign-api-key
    - secretKey: ALERTS_EMAIL_API_KEY
      remoteRef:
        key: lucide-alerts-email-api-key
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: lucide-slack-webhook-url
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: lucide-telegram-bot-token
    - secretKey: SENTRY_DSN
      remoteRef:
        key: lucide-sentry-dsn
    - secretKey: GOOGLE_CREDENTIALS_JSON
      remoteRef:
        key: lucide-google-credentials

---
# ============================================================================
# Service Account for IRSA (IAM Roles for Service Accounts)
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lucide-sa
  namespace: default
  annotations:
    # EKS: Link to IAM role
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/lucide-secrets-role

---
# ============================================================================
# Example: HashiCorp Vault
# ============================================================================
# Prerequisites:
# 1. Vault server running and unsealed
# 2. Install external-secrets
# 3. Configure Vault with KV v2 secrets engine at path "lucide/"

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secrets-store
  namespace: default
spec:
  provider:
    vault:
      server: "https://vault.example.com:8200"
      path: "lucide"
      version: v2
      # Auth: Token (dev only)
      # auth:
      #   tokenRef:
      #     secretRef:
      #       name: vault-token
      #       key: token
      # Auth: Kubernetes (production)
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "lucide-app"

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lucide-secret-vault
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secrets-store
    kind: SecretStore
  target:
    name: lucide-secret
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: api-key
    - secretKey: SESSION_SECRET
      remoteRef:
        key: session-secret
    - secretKey: ASAAS_API_KEY
      remoteRef:
        key: asaas-api-key

---
# ============================================================================
# Example: Google Cloud Secret Manager
# ============================================================================
# Prerequisites:
# 1. Create secrets in Google Cloud Secret Manager
# 2. Install external-secrets
# 3. Create Google Service Account with secretmanager.secretAccessor role
# 4. Create Kubernetes secret with SA credentials

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcpsm-secrets-store
  namespace: default
spec:
  provider:
    gcpsm:
      projectID: "my-gcp-project"
      auth:
        secretRef:
          secretAccessKey:
            name: gcpsm-secret
            key: secret-access-credentials

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lucide-secret-gcp
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcpsm-secrets-store
    kind: SecretStore
  target:
    name: lucide-secret
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: lucide-api-key
    - secretKey: SESSION_SECRET
      remoteRef:
        key: lucide-session-secret

---
# ============================================================================
# Example: Azure Key Vault
# ============================================================================
# Prerequisites:
# 1. Create Azure Key Vault
# 2. Create Azure Service Principal
# 3. Grant Service Principal access to Key Vault
# 4. Create Kubernetes secret with SP credentials

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-secrets-store
  namespace: default
spec:
  provider:
    azurekv:
      vaultUrl: "https://lucide-vault.vault.azure.net"
      tenantId: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      authSecretRef:
        clientId:
          name: azure-secret
          key: client-id
        clientSecret:
          name: azure-secret
          key: client-secret

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lucide-secret-azure
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-secrets-store
    kind: SecretStore
  target:
    name: lucide-secret
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: lucide-api-key

---
# ============================================================================
# Troubleshooting
# ============================================================================
# # Check SecretStore status
# kubectl get secretstore
# kubectl describe secretstore aws-secrets-store
#
# # Check ExternalSecret status
# kubectl get externalsecrets
# kubectl describe externalsecret lucide-secret
#
# # Check if secret was created
# kubectl get secret lucide-secret -o yaml
#
# # View controller logs
# kubectl logs -n external-secrets-system deployment/external-secrets
#
# # Manually sync (if needed)
# kubectl annotate externalsecret lucide-secret force-sync="$(date +%s)" --overwrite
