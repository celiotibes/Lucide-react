---
# ============================================================================
# SETUP INSTRUCTIONS
# ============================================================================
#
# 1. INSTALL INGRESS CONTROLLER (Nginx)
#    kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
#
# 2. INSTALL CERT-MANAGER
#    kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.2/cert-manager.yaml
#    kubectl wait --for=condition=Established crd/certificates.cert-manager.io --timeout=300s
#
# 3. UPDATE DOMAIN NAMES
#    Replace "lucide-react.example.com" with your actual domain
#    Replace "your-email@example.com" with your email
#
# 4. CREATE INGRESS
#    kubectl apply -f k8s/ingress.yaml
#
# 5. VERIFY SETUP
#    kubectl get ingress lucide-app-ingress -w  # Watch for IP
#    kubectl get certificate -w                 # Watch TLS cert
#    kubectl describe certificate lucide-tls-secret
#
# 6. DNS SETUP
#    Point your domain to the ingress controller IP:
#    - Get IP: kubectl get ingress lucide-app-ingress -o wide
#    - Create A record: lucide-react.example.com -> <INGRESS_IP>
#    - Wait for DNS propagation (5-48 hours)
#
# 7. TROUBLESHOOTING
#    # Check ingress
#    kubectl describe ingress lucide-app-ingress
#
#    # Check certificate
#    kubectl describe certificate lucide-tls-secret
#
#    # Check ingress controller logs
#    kubectl logs -n ingress-nginx deployment/ingress-nginx-controller -f
#
#    # Verify DNS
#    nslookup lucide-react.example.com
#
#    # Test connectivity
#    curl -v https://lucide-react.example.com/api/health
