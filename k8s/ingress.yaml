# ============================================================================
# Kubernetes Ingress for Lucide App
# ============================================================================
# This Ingress provides external HTTP/HTTPS routing to the application
# Requires an ingress controller (e.g., nginx, traefik, aws-alb)
#
# IMPORTANT NOTES:
# 1. Install ingress controller: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
# 2. Update hostname: Replace "lucide-react.example.com" with your domain
# 3. TLS certificate: Create secret or use cert-manager for automatic issuance
# 4. DNS: Point your domain to the ingress load balancer IP
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lucide-app-ingress
  namespace: default
  labels:
    app: lucide-app
    version: v1
  annotations:
    # Ingress class (nginx is most common)
    kubernetes.io/ingress.class: "nginx"

    # TLS redirect: redirect HTTP to HTTPS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://lucide-react.example.com"

    # Rate limiting (prevent abuse)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"

    # Body size limit
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"

    # SSL redirect
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

    # Modsecurity (WAF) - optional
    # nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    # nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"

spec:
  # TLS configuration
  tls:
    - hosts:
        - lucide-react.example.com
        - api.lucide-react.example.com
      secretName: lucide-tls-secret

  # Rules
  rules:
    # Main domain
    - host: lucide-react.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lucide-app
                port:
                  number: 80

    # API subdomain (optional)
    - host: api.lucide-react.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lucide-app
                port:
                  number: 80

---
# ============================================================================
# TLS Certificate (Using cert-manager + Let's Encrypt)
# ============================================================================
# Prerequisites:
# 1. Install cert-manager: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.2/cert-manager.yaml
# 2. Create ClusterIssuer (see below)

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production server (use letsencrypt-staging for testing)
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      # HTTP-01 solver (requires your domain to be reachable from the internet)
      - http01:
          ingress:
            class: nginx

---
