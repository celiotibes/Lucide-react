# ============================================================================
# Kubernetes Secret Template
# ============================================================================
# This is a TEMPLATE file. It demonstrates how to structure secrets in
# Kubernetes. DO NOT commit actual secret values to this file or to git.
#
# IMPORTANT: In production, use:
#   1. Sealed Secrets (sealed-secrets): Encrypt secrets at rest
#   2. External Secrets Operator: Integrate with AWS Secrets Manager,
#      HashiCorp Vault, Azure Key Vault, Google Cloud Secret Manager
#   3. kube-apiserver encryption at rest
#
# See DOCKER-SETUP.md for complete secrets management strategy.
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: lucide-secret
  namespace: default
  labels:
    app: lucide-app
    version: v1
  annotations:
    # Mark this as sensitive
    secret.vault/encrypted: "true"

# Secret type
type: Opaque

# Secret data (values must be base64-encoded)
# Generate base64: echo -n "value" | base64
# Decode base64: echo "encoded-value" | base64 -d
data:
  # ===================================
  # SECURITY (REQUIRED)
  # ===================================

  # API Key — CHANGE IN PRODUCTION
  # Generate: openssl rand -base64 32
  API_KEY: "Y2hhbmdlLW1lLXBsZWFzZS1nZW5lcmF0ZS1zZWN1cmUtYXBpLWtleQ=="

  # Session secret — CHANGE IN PRODUCTION
  # Generate: openssl rand -base64 32
  SESSION_SECRET: "Y2hhbmdlLW1lLXBsZWFzZS1nZW5lcmF0ZS1zZWN1cmUtc2Vzc2lvbi1zZWNyZXQ="

  # ===================================
  # INTEGRATIONS - ASAAS
  # ===================================

  # Asaas API Key
  ASAAS_API_KEY: ""

  # ===================================
  # INTEGRATIONS - PLUGGY
  # ===================================

  # Pluggy Client ID
  PLUGGY_CLIENT_ID: ""

  # Pluggy Client Secret
  PLUGGY_CLIENT_SECRET: ""

  # ===================================
  # INTEGRATIONS - DIGITAL SIGNATURE
  # ===================================

  # CertSign API Key
  CERTISIGN_API_KEY: ""

  # Serproid API Key
  SERPROID_API_KEY: ""

  # ===================================
  # NOTIFICATIONS - EMAIL
  # ===================================

  # Email provider API key (Resend or SendGrid)
  ALERTS_EMAIL_API_KEY: ""

  # ===================================
  # NOTIFICATIONS - SLACK
  # ===================================

  # Slack incoming webhook URL
  SLACK_WEBHOOK_URL: ""

  # ===================================
  # NOTIFICATIONS - TELEGRAM
  # ===================================

  # Telegram Bot Token
  TELEGRAM_BOT_TOKEN: ""

  # ===================================
  # MONITORING - SENTRY
  # ===================================

  # Sentry DSN
  SENTRY_DSN: ""

  # ===================================
  # BACKUP - GOOGLE DRIVE
  # ===================================

  # Google Service Account JSON (entire JSON as base64)
  # Note: This is large. Consider using External Secrets Operator instead.
  GOOGLE_CREDENTIALS_JSON: ""

  # ===================================
  # AI - ANTHROPIC API
  # ===================================

  # Anthropic Claude API Key
  # WARNING: Only use backend classification endpoint in production
  VITE_ANTHROPIC_API_KEY: ""

---
# ============================================================================
# Template: Create Secret from .env file (one-liner)
# ============================================================================
# kubectl create secret generic lucide-secret \
#   --from-env-file=.env.kubernetes \
#   --namespace=default \
#   --dry-run=client -o yaml | kubectl apply -f -

---
# ============================================================================
# Template: Create Secret from individual files
# ============================================================================
# kubectl create secret generic lucide-secret \
#   --from-file=api-key=./secrets/api-key.txt \
#   --from-file=session-secret=./secrets/session-secret.txt \
#   --from-file=asaas-api-key=./secrets/asaas-api-key.txt \
#   --namespace=default

---
# ============================================================================
# Example: Using External Secrets Operator (Recommended for Production)
# ============================================================================
# This example shows how to fetch secrets from AWS Secrets Manager
#
# Uncomment if you have ExternalSecrets operator installed
#
# apiVersion: external-secrets.io/v1beta1
# kind: SecretStore
# metadata:
#   name: aws-secrets
#   namespace: default
# spec:
#   provider:
#     aws:
#       service: SecretsManager
#       region: us-east-1
#       auth:
#         jwt:
#           serviceAccountRef:
#             name: lucide-sa
#
# ---
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: lucide-secret
#   namespace: default
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: aws-secrets
#     kind: SecretStore
#   target:
#     name: lucide-secret
#     creationPolicy: Owner
#   data:
#     - secretKey: API_KEY
#       remoteRef:
#         key: lucide-api-key
#     - secretKey: SESSION_SECRET
#       remoteRef:
#         key: lucide-session-secret
#     - secretKey: ASAAS_API_KEY
#       remoteRef:
#         key: lucide-asaas-key

---
# ============================================================================
# Example: Using Sealed Secrets (Alternative to External Secrets)
# ============================================================================
# This example shows encrypted secrets using Bitnami Sealed Secrets
#
# 1. Install sealed-secrets: helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
# 2. Encrypt secrets: echo -n "my-secret" | kubectl create secret generic mysecret --dry-run=client --from-file=/dev/stdin | kubeseal -o yaml
#
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: lucide-secret
#   namespace: default
# spec:
#   encryptedData:
#     API_KEY: AgBv... (encrypted data)
#     SESSION_SECRET: AgCd... (encrypted data)
#   template:
#     metadata:
#       name: lucide-secret
#       namespace: default
#     type: Opaque

---
# ============================================================================
# IMPORTANT REMINDERS
# ============================================================================
# 1. NEVER commit actual secrets to git
# 2. Base64 is NOT encryption — secrets are still visible in etcd by default
# 3. Always use:
#    - Sealed Secrets OR
#    - External Secrets Operator OR
#    - kube-apiserver encryption at rest
# 4. Rotate secrets regularly
# 5. Audit secret access with:
#    kubectl get events --field-selector involvedObject.name=lucide-secret
#    kubectl logs -l app=lucide-app | grep SECRET
# 6. Delete temporary files with sensitive data:
#    shred -vfz .env.kubernetes
