# ============================================================================
# Sealed Secrets - Production Secret Encryption
# ============================================================================
# Install: helm repo add sealed-secrets https://kubernetes.github.io/sealed-secrets
# helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
#
# Usage:
# 1. Create a secret: kubectl create secret generic mysecret --from-literal=key=value --dry-run=client -o yaml > secret.yaml
# 2. Seal it: kubeseal -f secret.yaml -w sealed-secret.yaml
# 3. Apply sealed secret: kubectl apply -f sealed-secret.yaml
# 4. Controller automatically decrypts and creates the actual secret

apiVersion: v1
kind: Secret
metadata:
  name: lucide-secret-rotation-template
  namespace: default
  labels:
    app: lucide-app
    managed-by: sealed-secrets
type: Opaque
stringData:
  # ============================================================================
  # API and Authentication Keys
  # ============================================================================
  API_KEY: "your-api-key-here"
  SESSION_SECRET: "your-session-secret-here"

  # ============================================================================
  # Third-party Service Keys
  # ============================================================================
  ASAAS_API_KEY: "your-asaas-key-here"
  PLUGGY_CLIENT_ID: "your-pluggy-client-id-here"
  PLUGGY_CLIENT_SECRET: "your-pluggy-client-secret-here"
  CERTISIGN_API_KEY: "your-certisign-api-key-here"
  ALERTS_EMAIL_API_KEY: "your-alerts-email-api-key-here"

  # ============================================================================
  # Communication Services
  # ============================================================================
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  TELEGRAM_BOT_TOKEN: "your-telegram-bot-token-here"

  # ============================================================================
  # Observability
  # ============================================================================
  SENTRY_DSN: "https://your-sentry-dsn@sentry.io/project-id"

  # ============================================================================
  # Cloud Services
  # ============================================================================
  GOOGLE_CREDENTIALS_JSON: '{"type": "service_account", "project_id": "..."}'

---
# ============================================================================
# Secret Rotation Schedule (CronJob)
# ============================================================================
# This CronJob triggers secret rotation every 30 days
# It patches the secret with a new value and triggers pod restart
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lucide-secret-rotation
  namespace: default
spec:
  # Rotate every 30 days at 2:00 AM UTC
  schedule: "0 2 */30 * *"

  # Keep 3 successful and 1 failed job for reference
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  # Start deadline 5 minutes
  startingDeadlineSeconds: 300

  # Concurrency policy: only one job at a time
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: secret-rotator
          restartPolicy: OnFailure

          containers:
            - name: secret-rotator
              image: bitnami/kubectl:latest
              imagePullPolicy: IfNotPresent

              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  # Fetch current secret
                  SECRET=$(kubectl get secret lucide-secret -n default -o yaml)

                  # Add annotation to trigger pod restart
                  kubectl patch secret lucide-secret -n default \
                    -p '{"metadata":{"annotations":{"rotation-time":"'$(date +%s)'"}}}' \
                    --type merge

                  # Restart deployment to pick up new secret
                  kubectl rollout restart deployment/lucide-app -n default

                  # Wait for rollout to complete
                  kubectl rollout status deployment/lucide-app -n default --timeout=10m

                  echo "Secret rotation completed at $(date)"

              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi

---
# ============================================================================
# RBAC: ServiceAccount and ClusterRole for Secret Rotation
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-rotator
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-rotator
rules:
  # Get, patch secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames: ["lucide-secret"]

  # Restart deployment
  - apiGroups: ["apps"]
    resources: ["deployments/rollout"]
    verbs: ["create"]
    resourceNames: ["lucide-app"]

  # List and watch deployments for status
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
    resourceNames: ["lucide-app"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-rotator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-rotator
subjects:
  - kind: ServiceAccount
    name: secret-rotator
    namespace: default

---
# ============================================================================
# Monitoring Secret Rotation
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-rotation-scripts
  namespace: default
data:
  # Script to manually trigger rotation
  rotate-secrets.sh: |
    #!/bin/bash
    # Manual secret rotation script
    # Usage: kubectl -n default exec <pod> -- /scripts/rotate-secrets.sh

    set -e

    echo "Starting manual secret rotation..."

    # Get current timestamp
    ROTATION_TIME=$(date +%s)

    # Patch secret with rotation time
    kubectl patch secret lucide-secret \
      -p '{"metadata":{"annotations":{"rotation-time":"'$ROTATION_TIME'","rotated-by":"manual"}}}'

    # Trigger pod restart via deployment annotation
    kubectl patch deployment lucide-app \
      -p '{"spec":{"template":{"metadata":{"annotations":{"rotation-time":"'$ROTATION_TIME'"}}}}}'

    echo "Secret rotation triggered at $(date)"
    echo "Waiting for deployment to stabilize..."
    kubectl rollout status deployment/lucide-app --timeout=10m

  # Verify secret is in use by pods
  verify-secret-usage.sh: |
    #!/bin/bash
    # Verify that all pods are using the latest secret version

    echo "Checking secret usage in running pods..."

    PODS=$(kubectl get pods -l app=lucide-app -o name)
    for POD in $PODS; do
      echo "Checking $POD..."
      kubectl exec $POD -- sh -c 'echo "Mounted secret version: $(stat /var/run/secrets/kubernetes.io/serviceaccount/token | grep Modify)"'
    done

---
# ============================================================================
# Secret Validation and Health Check
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-validation
  namespace: default
data:
  validate-secrets.sh: |
    #!/bin/bash
    # Validate that secrets are properly configured

    set -e

    echo "Validating Lucide secrets configuration..."

    # Check if secret exists
    if ! kubectl get secret lucide-secret &> /dev/null; then
      echo "ERROR: Secret 'lucide-secret' not found"
      exit 1
    fi

    # Check if secret has required keys
    REQUIRED_KEYS=(
      "API_KEY"
      "SESSION_SECRET"
      "ASAAS_API_KEY"
      "PLUGGY_CLIENT_ID"
      "PLUGGY_CLIENT_SECRET"
      "SLACK_WEBHOOK_URL"
      "SENTRY_DSN"
    )

    for KEY in "${REQUIRED_KEYS[@]}"; do
      if ! kubectl get secret lucide-secret -o jsonpath="{.data.$KEY}" &> /dev/null; then
        echo "WARNING: Key '$KEY' not found in secret"
      fi
    done

    # Check rotation timestamp
    ROTATION_TIME=$(kubectl get secret lucide-secret -o jsonpath="{.metadata.annotations.rotation-time}")
    if [ -z "$ROTATION_TIME" ]; then
      echo "WARNING: No rotation timestamp found"
    else
      echo "Last rotation: $(date -d @$ROTATION_TIME)"
    fi

    echo "Secret validation complete"

---
# ============================================================================
# Documentation and Notes
# ============================================================================
# KEY POINTS:
#
# 1. SECRET ROTATION:
#    - CronJob runs every 30 days to trigger rotation
#    - Patches secret with new rotation timestamp
#    - Triggers deployment rollout to pick up new secret
#    - Zero-downtime using rolling update strategy
#
# 2. POD RESTART BEHAVIOR:
#    - Pod gracefully terminates with 30-second grace period
#    - Pre-stop hook ensures in-flight requests complete
#    - New pod starts with fresh secret mounted
#    - Service remains available during rollout
#
# 3. VALIDATION:
#    - Run: kubectl apply -f /dev/stdin < k8s/sealed-secret-template.yaml
#    - Verify: kubectl get secret lucide-secret
#    - Check rotation: kubectl get secret lucide-secret -o yaml | grep rotation-time
#
# 4. MONITORING:
#    - Monitor CronJob execution: kubectl get cronjob lucide-secret-rotation -w
#    - Check job logs: kubectl logs job/<job-name>
#    - Monitor pod restarts: kubectl get pods -l app=lucide-app -w
