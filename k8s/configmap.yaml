#   ALLOWED_ORIGIN: "https://staging.yourdomain.com"
#   LOG_LEVEL: "debug"
#   ASAAS_SANDBOX: "true"
#   SENTRY_ENVIRONMENT: "staging"
#   ALERTS_EMAIL_PROVIDER: "resend"
#   ALERTS_EMAIL_FROM: "alerts-staging@yourdomain.com"
#   ALERTS_EMAIL_TO_ADMIN: "dev-team@yourdomain.com"

---
