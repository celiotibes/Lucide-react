version: '3.8'

services:
  # ============================================================================
  # API Backend (Node.js)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rental-sync-api
    ports:
      - "3000:3000"
      - "9229:9229" # Debug port
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DB_USER:-rental_user}:${DB_PASSWORD:-rental_pass}@postgres:5432/${DB_NAME:-rental_sync}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/package.json:/app/backend/package.json
    command: npm run dev
    networks:
      - rental-sync-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: rental-sync-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-rental_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-rental_pass}
      - POSTGRES_DB=${DB_NAME:-rental_sync}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rental-sync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: rental-sync-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rental-sync-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Prometheus (Monitoring)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: rental-sync-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - rental-sync-network

  # ============================================================================
  # Grafana (Visualization)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: rental-sync-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - rental-sync-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  rental-sync-network:
    driver: bridge
