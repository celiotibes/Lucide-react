version: '3.8'

services:
  # ============================================================================
  # Application Backend (Express.js + TypeScript)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: lucide-app
    ports:
      - "3000:3000"
    environment:
      # Core Configuration
      NODE_ENV: production
      PORT: 3000

      # Database (uses named volume for persistence)
      DATABASE_URL: file:./data/app.db

      # Security
      API_KEY: ${API_KEY:-change-me-in-production}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-session-secret}
      ENCRYPTION_MASTER_SECRET: ${ENCRYPTION_MASTER_SECRET:-${API_KEY}}

      # CORS (vazio = só mesma origem; ver docs/TOPOLOGIA-IMPLANTACAO.md)
      CORS_ORIGINS: ${CORS_ORIGINS:-}

      # Integrations (Optional)
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_SANDBOX: ${ASAAS_SANDBOX:-false}
      CERTISIGN_API_KEY: ${CERTISIGN_API_KEY:-}
      SERPROID_API_KEY: ${SERPROID_API_KEY:-}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}

      # Notifications (Optional)
      ALERTS_EMAIL_PROVIDER: ${ALERTS_EMAIL_PROVIDER:-none}
      ALERTS_EMAIL_API_KEY: ${ALERTS_EMAIL_API_KEY:-}
      ALERTS_EMAIL_FROM: ${ALERTS_EMAIL_FROM:-}
      ALERTS_EMAIL_TO_ADMIN: ${ALERTS_EMAIL_TO_ADMIN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}

      # Sentry (Optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

      # Google Drive Backup (Optional)
      GOOGLE_CREDENTIALS_JSON: ${GOOGLE_CREDENTIALS_JSON:-}

      # Anthropic Claude API (Optional)
      VITE_ANTHROPIC_API_KEY: ${VITE_ANTHROPIC_API_KEY:-}

      # Cache Configuration (Optional)
      CACHE_TTL_DRE: ${CACHE_TTL_DRE:-3600000}
      CACHE_TTL_FLUXO: ${CACHE_TTL_FLUXO:-7200000}
      CACHE_TTL_MARGENS: ${CACHE_TTL_MARGENS:-7200000}
      CACHE_TTL_RECONCILIACAO: ${CACHE_TTL_RECONCILIACAO:-1800000}

      # Backup Configuration
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}

    volumes:
      # Persistent named volumes for data protection
      - lucide-data:/app/data
      - lucide-logs:/app/logs

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Restart policy
    restart: unless-stopped

    # Network
    networks:
      - lucide-network

    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
        reservations:
          cpus: '1'
          memory: 512M

    # Container dependency on database initialization (if needed)
    # depends_on:
    #   - database

  # ============================================================================
  # Backup Service (Scheduled Database Backups)
  # ============================================================================
  backup:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: lucide-backup
    command: node /app/server/src/services/backup-scheduler.js
    environment:
      NODE_ENV: production
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      # Read-only access to application data
      - lucide-data:/app/data:ro
      # Backup storage volume
      - lucide-backups:/app/backups
      # Logs
      - lucide-logs:/app/logs
    restart: unless-stopped
    networks:
      - lucide-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================================================
  # Optional: Database Service (for persistent SQLite or PostgreSQL)
  # ============================================================================
  # Uncomment below if you want to use a separate database service
  # database:
  #   image: postgres:16-alpine
  #   container_name: lucide-db
  #   environment:
  #     POSTGRES_DB: lucide_accounting
  #     POSTGRES_USER: lucide_user
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U lucide_user"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - lucide-network
  #   restart: unless-stopped

  # ============================================================================
  # Development: Frontend Service (Optional, for live development)
  # ============================================================================
  # Uncomment below if developing frontend alongside backend
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.frontend
  #   container_name: lucide-frontend
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_API_URL: http://app:8787
  #   volumes:
  #     - ./src:/app/src
  #     - ./public:/app/public
  #   networks:
  #     - lucide-network
  #   restart: unless-stopped

# ============================================================================
# Volumes
# ============================================================================
volumes:
  lucide-data:
    driver: local
  lucide-backups:
    driver: local
  lucide-logs:
    driver: local
  # postgres_data:

# ============================================================================
# Networks
# ============================================================================
networks:
  lucide-network:
    driver: bridge
