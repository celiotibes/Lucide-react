# SSL/TLS Security Configuration
# Arquivo: nginx/ssl-defaults.conf
# Inclua este arquivo em seus blocos server para hardening de SSL

# SSL Protocols - apenas TLS 1.2 e 1.3
ssl_protocols TLSv1.2 TLSv1.3;

# Ciphers - configuração forte seguindo Mozilla recommendations
# Moderna: suporta navegadores modernos
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

# Preferir ciphers do servidor
ssl_prefer_server_ciphers on;

# Sessão SSL
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# OCSP Stapling - melhor performance e privacidade
ssl_stapling on;
ssl_stapling_verify on;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# Diffie-Hellman parameter
ssl_dhparam /etc/nginx/ssl/dhparam.pem;

# ============================================================================
# Security Headers
# ============================================================================

# Strict-Transport-Security - força HTTPS
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content-Security-Policy - previne XSS e injeção
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.grafana.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

# X-Content-Type-Options - previne MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# X-Frame-Options - previne clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# X-XSS-Protection - proteção XSS em navegadores antigos
add_header X-XSS-Protection "1; mode=block" always;

# Referrer-Policy - controla informações de referrer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy - controla funcionalidades do navegador
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# Remove header Server para não expor versão
server_tokens off;

# ============================================================================
# Performance Tuning
# ============================================================================

# Timeouts
proxy_connect_timeout 600s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;

# Buffering
proxy_buffering on;
proxy_buffer_size 4k;
proxy_buffers 8 4k;
proxy_busy_buffers_size 8k;

# Gzip
gzip on;
gzip_vary on;
gzip_min_length 1000;
gzip_proxied any;
gzip_types text/plain text/css text/xml text/javascript 
           application/json application/javascript application/xml+rss 
           application/atom+xml image/svg+xml;
gzip_disable "msie6";
gzip_comp_level 6;

# ============================================================================
# Rate Limiting e DDoS Protection
# ============================================================================

# Limit request rate
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_status 429;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_conn conn_limit 10;

# ============================================================================
# Access Logging
# ============================================================================

log_format security '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'ssl_protocol=$ssl_protocol ssl_cipher=$ssl_cipher '
                   'request_time=$request_time upstream_response_time=$upstream_response_time';

# Incluir este formato em access_log:
# access_log /var/log/nginx/security.log security buffer=32k flush=5s;
